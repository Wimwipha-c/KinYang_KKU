<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ผู้ดูแล — กินหยัง KKU</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F6F1E9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15110E" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script>
    /* ใส่ธีมที่ผู้ใช้เลือกไว้ก่อนหน้าเว็บจะแสดง เพื่อไม่ให้จอกะพริบ */
    try { var t = JSON.parse(localStorage.getItem("kky_theme")); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <!-- ไอคอนที่หน้านี้ใช้ -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-logo" viewBox="0 0 24 24"><path d="M3.5 12.5h17a8.5 7.5 0 0 1-17 0z"/><path d="M6.8 12.5a5.2 4.2 0 0 1 10.4 0"/><path d="M9 21h6"/><path d="m13.2 9.6 3.6-7M15.6 10.2l5-5.6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.6l2.55 5.2 5.7.83-4.13 4.03.98 5.69L12 16.67l-5.1 2.68.98-5.69L3.75 9.63l5.7-.83z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4.5H15"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.6v.01"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.4v.01"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5.5 21V4"/><path d="M5.5 4.5h11.5l-2.2 4.25L17 13H5.5"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="m10 16-4-4 4-4M6 12h10"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.2 7.5 9.5 4.3-1.3 7.5-4.9 7.5-9.5V6z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6"/><path d="m6 7 1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
  </svg>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="logo" href="./" aria-label="กินหยัง KKU กลับหน้าหลัก">
        <span class="logo__mark" aria-hidden="true"><svg class="icon"><use href="#i-logo"/></svg></span>
        <span class="logo__text">กินหยัง<span class="logo__tag">ADMIN</span></span>
      </a>
      <button type="button" class="icon-btn theme-btn" id="themeBtn" data-act="theme" aria-label="สลับธีม">
        <svg class="icon icon-moon" aria-hidden="true"><use href="#i-moon"/></svg>
        <svg class="icon icon-sun" aria-hidden="true"><use href="#i-sun"/></svg>
      </button>
      <a class="btn btn-secondary btn-sm" href="./">กลับหน้าหลัก</a>
    </div>
  </header>

  <main class="section container admin" id="top">
    <div class="section__head">
      <div>
        <h1 class="section__title">ตรวจรายงานรีวิว</h1>
        <p class="section__meta" id="adminMeta" aria-live="polite"></p>
      </div>
      <button type="button" class="btn btn-ghost btn-sm" id="adminRefresh" data-act="admin-refresh" hidden>
        <svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg>โหลดใหม่
      </button>
    </div>
    <div class="segmented admin__tabs" id="adminTabs" role="group" aria-label="สถานะรายงาน" hidden></div>
    <!-- เนื้อหาสร้างโดย js/admin.js -->
    <div id="adminBody"></div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/theme.js" defer></script>
  <script src="js/db.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/admin.js" defer></script>
</body>
</html>
